<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الدفع بنجاح - منظومة سليمان ماهر الذكية</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #2ea043;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
        }
        .checkmark {
            font-size: 50px;
            color: #2ea043;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="checkmark">✓</div>
        <h2>تم الدفع بنجاح!</h2>
        <p id="status-text">جاري إرسال طلبك ومعالجته، سيصلك الملف قريباً...</p>
    </div>

    <script>
        // رابط الـ Webhook الخاص بمشروعك
        const webhookUrl = 'https://hook.eu1.make.com/hr22onsg1iv8fvlkhpl7asq6dy9thmv6';

        // إرسال البيانات للـ Webhook في الخلفية بدون انتظار الرد لمنع تعليق الصفحة
        fetch(webhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: 'success',
                timestamp: new Date().toISOString()
            })
        }).catch(err => {
            console.log('Background trigger sent');
        });

        // تغيير النص بعد ثانيتين لتأكيد نجاح العملية للمستخدم
        setTimeout(() => {
            document.getElementById('status-text').innerText = 'تم استلام طلبك بنجاح وجاري العمل عليه.';
        }, 2000);
    </script>

</body>
</html>
