<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NOX | المنظومة الذكية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0b0f19; color: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* زر القائمة */
        .menu-btn { position: fixed; top: 20px; right: 20px; background: #131b2e; border: 1px solid #1e293b; color: #fff; padding: 10px 15px; border-radius: 8px; cursor: pointer; z-index: 1000; }

        /* القائمة الجانبية */
        .sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #111827; border-left: 1px solid #1f2937; transition: 0.4s; z-index: 999; padding: 20px; box-sizing: border-box; }
        .sidebar.open { right: 0; }
        .close-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 20px; }

        /* الواجهة الرئيسية */
        .card { background: #131b2e; padding: 30px; border-radius: 16px; width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #0b0f19; border: 1px solid #334155; color: #fff; text-align: right; }
        .generate-btn { width: 100%; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleSidebar()">☰ القائمة</button>

    <div class="sidebar" id="sidebar">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3>لوحة التحكم</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div style="background:#1f2937; padding:15px; border-radius:10px; text-align:center;">
            <p>مرحباً يا سليمان</p>
            <button style="background:#4f46e5; border:none; color:white; padding:5px 15px; border-radius:5px;">دخول</button>
        </div>
        <div style="margin-top:20px;">
            <h4>الملفات المحفوظة</h4>
            <div style="background:#1f2937; padding:10px; border-radius:8px; margin-bottom:5px;">📄 تقرير الميزانية</div>
        </div>
    </div>

    <div class="card">
        <h2>NOX ENGINE v2.0</h2>
        <input type="text" id="topic" placeholder="موضوع الملف">
        <input type="password" id="apiKey" placeholder="مفتاح الوصول">
        <select id="serviceType">
            <option value="word">تقرير نصي - Word</option>
            <option value="powerpoint">عرض تقديمي - PowerPoint</option>
            <option value="excel">جدول بيانات - Excel</option>
        </select>
        <button class="generate-btn" onclick="generateFile()">تنفيذ وتوليد الملف</button>
        <div id="status" style="margin-top:15px;"></div>
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        async function generateFile() {
            // كود التوليد كما هو
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = '⏳ جاري المعالجة...';
            // ... (بقية كود الاتصال كما سبق)
        }
    </script>
</body>
</html
