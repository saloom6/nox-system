<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة سليمان ماهر الذكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; }
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #10b981;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>

<div class="card">
    <h2>منظومة سليمان ماهر الذكية</h2>
    <p>أنشئ ملفاتك الاحترافية بـ 5$ فقط</p>

    <input type="text" id="topic" placeholder="ما هو موضوع التقرير أو المشروع؟">

    <select id="serviceType">
        <option value="excel">📊 جدول بيانات (Excel)</option>
        <option value="word">📝 تقرير (Word)</option>
        <option value="powerpoint">🎯 عرض تقديمي (PowerPoint)</option>
    </select>

    <button onclick="startBusiness()">ادفع $5 وابدأ التوليد</button>
</div>

<script>
function startBusiness() {
    const topic = document.getElementById('topic').value;
    const serviceType = document.getElementById('serviceType').value;

    if(!topic) {
        alert("يرجى إدخال موضوع المشروع أولاً!");
        return;
    }

    // حفظ البيانات في المتصفح لاستخدامها بعد الدفع
    localStorage.setItem('topic', topic);
    localStorage.setItem('type', serviceType);

    // توجيه الزبون لصفحة الدفع
    window.location.href = "https://buy.stripe.com/test_00w9AL7b55H5eyY7Re0Jq00";
}
</script>

</body>
</html>
